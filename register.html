<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | نظام تحليل سلوك الأطفال</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-big">🧠</div>
      <h1>إنشاء حساب جديد</h1>
      <p>انضم لنظام تحليل سلوك الأطفال</p>
    </div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label class="form-label">👤 الاسم الكامل</label>
        <input type="text" id="name" class="form-control" placeholder="أدخل اسمك الكامل" required>
      </div>

      <div class="form-group">
        <label class="form-label">📧 البريد الإلكتروني</label>
        <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">🎓 الدور الوظيفي</label>
        <select id="role" class="form-control">
          <option value="teacher">معلم / معلمة</option>
          <option value="parent">ولي أمر</option>
          <option value="specialist">أخصائي نفسي</option>
          <option value="admin">مدير مدرسة</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">🔒 كلمة المرور</label>
        <input type="password" id="password" class="form-control" placeholder="8 أحرف على الأقل" required>
      </div>

      <div class="form-group">
        <label class="form-label">🔒 تأكيد كلمة المرور</label>
        <input type="password" id="confirm" class="form-control" placeholder="أعد إدخال كلمة المرور" required>
      </div>

      <div class="form-error" id="reg-err" style="display:block;margin-bottom:1rem;text-align:center;"></div>

      <button type="submit" class="btn btn-primary btn-full btn-lg">📝 إنشاء الحساب</button>
    </form>

    <div class="auth-divider"><span>أو</span></div>

    <div class="text-center">
      <p style="color:var(--text-muted);font-size:0.9rem;">لديك حساب بالفعل؟
        <a href="login.html" style="color:var(--primary-light);font-weight:700;">تسجيل الدخول</a>
      </p>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script>
  redirectIfLoggedIn();

  document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const submitBtn = e.target.querySelector('button[type=submit]');
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const role     = document.getElementById('role').value;
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    const errEl    = document.getElementById('reg-err');
    errEl.textContent = '';

    if (!name || !email || !password || !confirm) { errEl.textContent = 'يرجى ملء جميع الحقول'; return; }
    if (password.length < 6) { errEl.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل'; return; }
    if (password !== confirm) { errEl.textContent = 'كلمتا المرور غير متطابقتين'; return; }

    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ جاري إنشاء الحساب...';

    const result = await DB.registerUser(name, email, password, role);
    if (!result.ok) {
      errEl.textContent = result.msg;
      submitBtn.disabled = false;
      submitBtn.textContent = '📝 إنشاء الحساب';
      return;
    }
    showToast('تم إنشاء الحساب بنجاح! أهلاً ' + name, 'success');
    setTimeout(() => window.location.href = 'dashboard.html', 900);
  });
</script>
</body>
</html>
