<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | نظام تحليل سلوك الأطفال</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-big">🧠</div>
      <h1>مرحباً بعودتك</h1>
      <p>سجّل دخولك للمتابعة</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label">📧 البريد الإلكتروني</label>
        <input type="email" id="email" class="form-control" placeholder="أدخل بريدك الإلكتروني" required>
        <span class="form-error" id="email-err">يرجى إدخال بريد إلكتروني صحيح</span>
      </div>

      <div class="form-group">
        <label class="form-label">🔒 كلمة المرور</label>
        <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" required>
        <span class="form-error" id="pass-err">يرجى إدخال كلمة المرور</span>
      </div>

      <div class="form-error" id="login-err" style="display:block;margin-bottom:1rem;text-align:center;"></div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">
        🔑 تسجيل الدخول
      </button>
    </form>

    <div class="auth-divider"><span>أو</span></div>

    <div class="text-center">
      <p style="color:var(--text-muted);font-size:0.9rem;">ليس لديك حساب؟
        <a href="register.html" style="color:var(--primary-light);font-weight:700;">إنشاء حساب جديد</a>
      </p>
    </div>

    <div class="mt-3 text-center">
      <a href="index.html" style="color:var(--text-muted);font-size:0.85rem;">← العودة للصفحة الرئيسية</a>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script>
  redirectIfLoggedIn();

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn      = document.getElementById('loginBtn');
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    const errEl    = document.getElementById('login-err');
    errEl.textContent = '';

    if (!email || !password) { errEl.textContent = 'يرجى ملء جميع الحقول'; return; }

    btn.disabled = true;
    btn.textContent = '⏳ جاري تسجيل الدخول...';

    const result = await DB.loginUser(email, password);
    if (!result.ok) {
      errEl.textContent = result.msg;
      btn.disabled = false;
      btn.textContent = '🔑 تسجيل الدخول';
      return;
    }
    showToast('أهلاً ' + result.user.name + '!', 'success');
    setTimeout(() => window.location.href = 'dashboard.html', 800);
  });
</script>
</body>
</html>
