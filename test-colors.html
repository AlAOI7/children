<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار نظام الألوان البيج</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="main-content">
    <div class="container">
      <div class="page-header">
        <h1>اختبار نظام الألوان البيج الجديد</h1>
        <p>هذه الصفحة لاختبار تطبيق الألوان الجديدة على جميع المكونات</p>
      </div>

      <!-- اختبار الأزرار -->
      <div class="card mb-4">
        <h3 class="section-title">الأزرار</h3>
        <div class="flex gap-2 flex-wrap">
          <button class="btn btn-primary">زر أساسي</button>
          <button class="btn btn-outline">زر محدد</button>
          <button class="btn btn-success">زر نجاح</button>
          <button class="btn btn-danger">زر خطر</button>
        </div>
      </div>

      <!-- اختبار الشارات -->
      <div class="card mb-4">
        <h3 class="section-title">الشارات</h3>
        <div class="flex gap-2 flex-wrap">
          <span class="badge badge-normal">طبيعي</span>
          <span class="badge badge-attention">انتباه</span>
          <span class="badge badge-hyperactive">فرط حركة</span>
          <span class="badge badge-autism">توحد</span>
          <span class="badge badge-pending">معلق</span>
        </div>
      </div>

      <!-- اختبار النماذج -->
      <div class="card mb-4">
        <h3 class="section-title">النماذج</h3>
        <div class="form-group">
          <label class="form-label">اسم الطفل</label>
          <input type="text" class="form-control" placeholder="أدخل اسم الطفل">
        </div>
        <div class="form-group">
          <label class="form-label">العمر</label>
          <select class="form-control">
            <option>اختر العمر</option>
            <option>3-5 سنوات</option>
            <option>6-8 سنوات</option>
            <option>9-12 سنة</option>
          </select>
        </div>
      </div>

      <!-- اختبار الإحصائيات -->
      <div class="grid grid-2 mb-4">
        <div class="stat-card">
          <div class="stat-icon stat-icon-purple">📊</div>
          <div class="stat-info">
            <h3>25</h3>
            <p>إجمالي التقييمات</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon stat-icon-green">✅</div>
          <div class="stat-info">
            <h3>18</h3>
            <p>نتائج طبيعية</p>
          </div>
        </div>
      </div>

      <!-- اختبار دوائر النتائج -->
      <div class="grid grid-2 mb-4">
        <div class="result-circle normal">
          85
          <div class="score-label">طبيعي</div>
        </div>
        <div class="result-circle attention">
          65
          <div class="score-label">انتباه</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
